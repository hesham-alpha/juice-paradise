  var started = false;

  // Pages that are a call to action (book, enquire, give…): with no matching section, send the

  var CTA_PAGE = /^(book|booking|trial|contact|enquire|inquire|apply|enrol|enroll|donate|give|quote|estimate|consult|start|tickets|hire|brief|membership|memberships|members|support|plan|plans|packages|pricing|tour|reserve|checkout|join|subscribe|signup)$/;
  function sectionFor(name, hash) {
    var stem = name.replace(/\.html$/i, '').toLowerCase();
    var ids = (hash ? [hash] : []).concat(SYNONYMS[stem] || [], [stem]);
    for (var i = 0; i < ids.length; i++) if (ids[i] && document.getElementById(ids[i])) return '#' + ids[i];
    var form = document.querySelector('main form, form');
    var host = form && (form.id ? form : form.closest('[id]'));
    if (host && host.id && host.id !== 'top') return '#' + host.id;
    if (CTA_PAGE.test(stem)) {
      var sections = document.querySelectorAll('main section[id], body > section[id]');
      var last = sections[sections.length - 1];

      var parts = a.href.split('#');

      if (file.indexOf(base) !== 0) continue;
      var name = file.slice(base.length);

      } else if (/\.html$/i.test(name)) {
        var hash = '';
        try {
          hash = parts[1] ? decodeURIComponent(parts[1]) : '';
        } catch (err) {}
        var target = sectionFor(name, hash);
        var li = a.parentElement && a.parentElement.tagName === 'LI' && a.parentElement.children.length === 1;
        var box = li ? a.parentElement : a;
        if (target) {

          if (box.hasAttribute('data-draftly-hidden')) {
